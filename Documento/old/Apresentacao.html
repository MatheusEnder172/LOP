<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apresentação de Possíveis Melhorias - LOP/UFMG</title>

  <style>
    :root {
      --bg: #07111b;
      --panel: #0f1824;
      --border: #213855;
      --text: #e9f3ff;
      --muted: #7fb3ff;
      --accent: #1565c0;
      --green: #2e7d32;
      --gold: #ffd54f;
      --orange: #e65100;
      --red: #c62828;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 64px;
      background: rgba(8, 18, 30, 0.94);
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 0 18px;
      z-index: 10;
    }

    .brand {
      font-weight: bold;
      color: var(--muted);
      margin-right: 12px;
    }

    .toolbar input {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #111d2c;
      color: var(--text);
      min-width: 220px;
    }

    .toolbar button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #111d2c;
      color: var(--text);
      cursor: pointer;
    }

    .toolbar button:hover {
      background: #172638;
    }

    .counter {
      margin-left: auto;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      height: 4px;
      background: #111d2c;
    }

    .progress div {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green), var(--gold));
      width: 0%;
    }

    .slide-title {
      position: fixed;
      top: 72px;
      left: 24px;
      font-size: 14px;
      color: var(--muted);
      z-index: 9;
    }

    .deck {
      max-width: 1100px;
      margin: 100px auto 40px;
      padding: 24px;
    }

    .slide {
      display: none;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      min-height: 480px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .slide.active {
      display: block;
    }

    h1, h2, h3 {
      margin-top: 0;
    }

    h1 {
      color: var(--gold);
    }

    h2 {
      color: var(--muted);
    }

    p, li {
      line-height: 1.55;
    }

    .badges {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .badge {
      background: #111d2c;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 16px 0;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 10px;
      vertical-align: top;
    }

    th {
      background: #111d2c;
      color: var(--muted);
    }

    .top10 {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bar-row span {
      min-width: 260px;
    }

    .bar {
      flex: 1;
      height: 18px;
      background: #111d2c;
      border-radius: 8px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--green), var(--gold));
    }

    .timeline {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .timeline-item {
      background: #111d2c;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal.open {
      display: flex;
    }

    .modal-body {
      width: min(900px, 92vw);
      max-height: 80vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      margin-top: 12px;
    }

    .grid-card {
      background: #111d2c;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .grid-card:hover {
      background: #172638;
    }

    .close {
      margin-top: 16px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #111d2c;
      color: var(--text);
      cursor: pointer;
    }

    .notes {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 360px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: none;
      z-index: 15;
    }

    .notes.open {
      display: block;
    }

    .notes strong {
      color: var(--gold);
    }

    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 18;
    }

    #confetti span {
      position: absolute;
      width: 8px;
      height: 12px;
      animation: fall 1s linear forwards;
    }

    @keyframes fall {
      from {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }
      to {
        transform: translateY(120vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>

    <div class="brand">LOP/UFMG</div>

    let current = 0;

    const slidesContainer = document.getElementById("slides");
    const gridCards = document.getElementById("gridCards");
    const notesText = document.getElementById("notesText");
    const slideTitle = document.getElementById("slideTitle");
    const counter = document.getElementById("counter");
    const progressBar = document.getElementById("progressBar");
    const searchInput = document.getElementById("searchInput");

    function render() {
      slidesContainer.innerHTML = slides
        .map((s, i) => `
          <article class="slide ${i === current ? "active" : ""}" id="${s.id}">
            ${s.content}
          </article>
        `)
        .join("");

      counter.textContent = `${current + 1}/${slides.length}`;
      progressBar.style.width = `${((current + 1) / slides.length) * 100}%`;
      slideTitle.textContent = slides[current].title;
      notesText.textContent = slides[current].notes;
    }

    function showSlide(index) {
      current = Math.max(0, Math.min(slides.length - 1, index));
      render();

      if (current === slides.length - 1) {
        confetti();
      }
    }

    function renderGrid() {
      const q = searchInput.value.toLowerCase();

      gridCards.innerHTML = slides
        .map((s, i) => {
          const text = `${s.title} ${s.notes}`.toLowerCase();
          if (q && !text.includes(q)) return "";

          return `
            <button class="grid-card" data-index="${i}">
              ${i + 1}. ${s.title}
            </button>
          `;
        })
        .join("");

      gridCards.querySelectorAll(".grid-card").forEach((btn) => {
        btn.addEventListener("click", () => {
          showSlide(Number(btn.dataset.index));
          closeModal("gridModal");
        });
      });
    }

    function confetti() {
      const confettiBox = document.getElementById("confetti");
      confettiBox.innerHTML = "";

      const colors = ["#2e7d32", "#1565c0", "#e65100", "#c62828", "#ffd54f"];

      for (let i = 0; i < 80; i++) {
        const span = document.createElement("span");
        span.style.left = `${Math.random() * 100}vw`;
        span.style.background = colors[i % colors.length];
        span.style.animationDuration = `${0.8 + Math.random() * 0.6}s`;
        confettiBox.appendChild(span);
      }
    }

    function toggleModal(id) {
      document.getElementById(id).classList.toggle("open");
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove("open");
    }

    function closeAllModals() {
      document.getElementById("gridModal").classList.remove("open");
      document.getElementById("helpModal").classList.remove("open");
    }

    function toggleNotes() {
      document.getElementById("notes").classList.toggle("open");
    }

    document.querySelectorAll("[data-action]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const action = btn.dataset.action;

        if (action === "next") showSlide(current + 1);
        if (action === "prev") showSlide(current - 1);
        if (action === "grid") toggleModal("gridModal");
        if (action === "notes") toggleNotes();
        if (action === "help") toggleModal("helpModal");
      });
    });

    document.querySelectorAll("[data-close]").forEach((btn) => {
      btn.addEventListener("click", () => {
        closeModal(btn.dataset.close);
      });
    });

    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;

      if (e.key === "ArrowRight") showSlide(current + 1);
      if (e.key === "ArrowLeft") showSlide(current - 1);

      if (e.key === " ") {
        e.preventDefault();
        showSlide(current + 1);
      }

      if (e.key === "Home") showSlide(0);
      if (e.key === "End") showSlide(slides.length - 1);

      if (e.key === "g" || e.key === "o") toggleModal("gridModal");
      if (e.key === "n") toggleNotes();
      if (e.key === "?") toggleModal("helpModal");

      if (e.key === "/") {
        e.preventDefault();
        searchInput.focus();
      }

      if (e.key === "Escape") closeAllModals();
    });

    searchInput.addEventListener("input", renderGrid);

    render();
    renderGrid();
  </script>
